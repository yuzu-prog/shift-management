<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>チェックアウト管理 | 清掃シフト</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEAE4;--card:#fff;--ink:#1A1A1E;--sub:#74747C;
  --go:#00956A;--go-bg:#E0F5EE;
  --ng:#D42B22;--ng-bg:#FDECEA;
  --maybe:#D08000;--maybe-bg:#FEF3C7;
  --airbnb:#FF5A5F;
  --r:16px;--sh:0 2px 14px rgba(0,0,0,.07);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:90px}

/* ── HEADER ── */
.hdr{background:var(--ink);padding:14px 16px 12px;position:sticky;top:0;z-index:100}
.hdr-row{display:flex;align-items:center;justify-content:space-between}
.hdr h1{font-size:16px;font-weight:900;color:#fff;display:flex;align-items:center;gap:7px}
.ab-dot{width:8px;height:8px;border-radius:50%;background:var(--airbnb)}
.back-btn{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:20px;padding:5px 13px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.sync-row{display:flex;align-items:center;gap:5px;margin-top:5px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#4CAF50}
.sync-dot.syncing{background:#FFB300;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.sync-txt{font-size:10px;color:rgba(255,255,255,.55);font-weight:700}

/* ── WEEK STRIP ── */
.week-wrap{background:var(--card);border-bottom:1px solid #EBEBEB;padding:10px 14px 12px;position:sticky;top:66px;z-index:90}
.week-month{font-size:11px;font-weight:700;color:var(--sub);margin-bottom:7px;display:flex;align-items:center;justify-content:space-between}
.today-btn{background:var(--airbnb);color:#fff;border:none;border-radius:20px;padding:3px 12px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer}
.week-strip{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.week-strip::-webkit-scrollbar{display:none}
.day-pill{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 9px;border-radius:12px;cursor:pointer;min-width:42px;border:1.5px solid transparent;transition:all .18s;flex-shrink:0}
.day-pill.has-co{border-color:var(--airbnb)}
.day-pill.active{background:var(--airbnb);border-color:var(--airbnb)}
.day-pill.is-today:not(.active){background:#F3F3F3}
.day-name{font-size:10px;color:var(--sub);font-weight:700;text-transform:uppercase}
.day-pill.active .day-name,.day-pill.active .day-num{color:#fff}
.day-num{font-size:16px;font-weight:900;color:var(--ink)}
.day-dot{width:5px;height:5px;border-radius:50%;background:var(--airbnb)}
.day-pill.active .day-dot{background:#fff}
.day-spacer{width:5px;height:5px}

/* ── STATS ── */
.stats-row{display:flex;gap:8px;padding:12px 14px 4px}
.stat-card{flex:1;background:var(--card);border-radius:14px;padding:11px 8px;text-align:center;box-shadow:var(--sh)}
.stat-num{font-size:24px;font-weight:900}
.stat-num.red{color:var(--ng)}
.stat-num.green{color:var(--go)}
.stat-num.gold{color:var(--maybe)}
.stat-lbl{font-size:10px;color:var(--sub);font-weight:700;margin-top:2px}

/* ── ALERT ── */
.alert-bar{margin:8px 14px 0;background:var(--ng-bg);border:1.5px solid var(--ng);border-radius:12px;padding:9px 13px;font-size:12px;font-weight:700;color:var(--ng);display:flex;align-items:center;gap:7px}

/* ── TABS ── */
.tabs{display:flex;background:var(--card);border-bottom:1px solid #EBEBEB;margin-top:8px}
.tab{flex:1;border:none;background:none;padding:10px 2px;font-size:11px;font-weight:700;font-family:inherit;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}

/* ── SECTION LABEL ── */
.sec-lbl{font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.1em;text-transform:uppercase;padding:14px 14px 6px;display:flex;align-items:center;gap:8px}
.sec-lbl::after{content:'';flex:1;height:1px;background:#E0E0E0}

/* ── CHECKOUT CARD ── */
.co-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin:0 14px 10px;overflow:hidden;animation:slideIn .25s ease both}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.co-card-hdr{display:flex;align-items:center;gap:9px;padding:11px 13px 10px;border-bottom:1px solid #F0F0F0}
.area-tag{font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;letter-spacing:.03em}
.tag-akasaka{background:#FFE9EA;color:var(--airbnb)}
.tag-katsushika{background:#E0F5EE;color:var(--go)}
.co-prop{font-size:14px;font-weight:900;flex:1}
.co-time{font-size:12px;font-weight:700;color:var(--sub);background:#F3F3F3;padding:3px 9px;border-radius:8px}

.co-body{display:flex;align-items:center;gap:11px;padding:10px 13px}
.guest-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.guest-name{font-size:13px;font-weight:800}
.guest-meta{font-size:11px;color:var(--sub);display:flex;gap:10px;margin-top:2px}

.co-footer{display:flex;align-items:center;justify-content:space-between;padding:8px 13px;background:#FAFAFA;border-top:1px solid #F0F0F0}
.cleaning-status{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.st-dot{width:8px;height:8px;border-radius:50%}
.st-ok{background:var(--go)}.st-ng{background:var(--ng)}.st-warn{background:var(--maybe)}
.st-ok-txt{color:var(--go)}.st-ng-txt{color:var(--ng)}.st-warn-txt{color:var(--maybe)}

.action-btn{border:none;border-radius:20px;font-size:11px;font-weight:800;font-family:inherit;padding:6px 14px;cursor:pointer;transition:opacity .2s}
.btn-arrange{background:var(--ng);color:#fff}
.btn-confirm{background:var(--maybe);color:#fff}
.btn-done{background:#EBEBEB;color:var(--sub)}

/* ── SHIFT LINK CARD ── */
.shift-link-card{background:linear-gradient(135deg,#1A1A1E,#2a2a35);border-radius:var(--r);margin:0 14px 10px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;text-decoration:none;transition:opacity .2s;box-shadow:var(--sh)}
.shift-link-card:active{opacity:.85}
.shift-link-ico{width:40px;height:40px;border-radius:12px;background:var(--airbnb);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.shift-link-txt{flex:1}
.shift-link-ttl{font-size:13px;font-weight:900;color:#fff}
.shift-link-sub{font-size:11px;color:rgba(255,255,255,.5);margin-top:2px}
.shift-link-arr{font-size:16px;color:rgba(255,255,255,.4)}

/* ── EMPTY ── */
.empty{text-align:center;padding:48px 24px;color:var(--sub)}
.empty-ico{font-size:36px;margin-bottom:10px}
.empty-ttl{font-size:14px;font-weight:700}
.empty-sub{font-size:11px;margin-top:4px}

/* ── BOTTOM NAV ── */
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid #EBEBEB;display:flex;padding:7px 0 13px;z-index:100}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;cursor:pointer;font-family:inherit;color:var(--sub);font-size:10px;font-weight:700}

/* ── TOAST ── */
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;border-radius:22px;padding:9px 18px;font-size:12px;font-weight:700;opacity:0;transition:all .25s;pointer-events:none;z-index:300;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── MODAL (清掃手配) ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:22px 22px 0 0;padding:18px 18px 36px;width:100%;max-width:460px;animation:modalUp .28s ease}
@keyframes modalUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.m-handle{width:34px;height:4px;background:#DDD;border-radius:2px;margin:0 auto 14px}
.m-title{font-size:16px;font-weight:900;margin-bottom:6px}
.m-sub{font-size:12px;color:var(--sub);margin-bottom:16px}
.m-prop-info{background:#F8F8F8;border-radius:12px;padding:12px;margin-bottom:14px}
.m-prop-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.m-prop-row:last-child{margin-bottom:0}
.m-prop-lbl{font-size:11px;color:var(--sub);font-weight:700;min-width:80px}
.m-prop-val{font-size:13px;font-weight:800}
.m-status-row{display:flex;gap:8px;margin-bottom:14px}
.m-status-btn{flex:1;border:2px solid #E0E0E0;background:#FAFAFA;border-radius:12px;padding:10px 5px;font-size:12px;font-weight:800;font-family:inherit;cursor:pointer;text-align:center;line-height:1.4;color:var(--sub);transition:all .15s}
.m-status-btn.ok.on{background:var(--go-bg);border-color:var(--go);color:var(--go)}
.m-status-btn.warn.on{background:var(--maybe-bg);border-color:var(--maybe);color:var(--maybe)}
.m-status-btn.ng.on{background:var(--ng-bg);border-color:var(--ng);color:var(--ng)}
.m-save{width:100%;background:var(--ink);color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;margin-top:6px}
.m-cancel{width:100%;background:#F3F3F3;color:var(--sub);border:none;border-radius:12px;padding:11px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:8px}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-row">
    <h1><span class="ab-dot"></span>チェックアウト管理</h1>
    <a href="https://tiny-sawine-5a9d7e.netlify.app/admin.html" class="back-btn">← シフト管理</a>
  </div>
  <div class="sync-row">
    <div class="sync-dot" id="syncDot"></div>
    <span class="sync-txt" id="syncTxt">接続中...</span>
  </div>
</div>

<!-- WEEK STRIP -->
<div class="week-wrap">
  <div class="week-month">
    <span id="monthLabel"></span>
    <button class="today-btn" onclick="goToday()">今日</button>
  </div>
  <div class="week-strip" id="weekStrip"></div>
</div>

<!-- STATS -->
<div class="stats-row">
  <div class="stat-card"><div class="stat-num red" id="statCO">—</div><div class="stat-lbl">本日CO</div></div>
  <div class="stat-card"><div class="stat-num gold" id="statTmr">—</div><div class="stat-lbl">明日CO</div></div>
  <div class="stat-card"><div class="stat-num green" id="statOk">—</div><div class="stat-lbl">清掃確認済</div></div>
  <div class="stat-card"><div class="stat-num red" id="statPend">—</div><div class="stat-lbl">要手配</div></div>
</div>

<!-- ALERT -->
<div class="alert-bar" id="alertBar" style="display:none">⚠️ 清掃が未手配の物件があります！</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab on" id="tab-today"    onclick="setTabView('today',this)">本日</button>
  <button class="tab"    id="tab-tomorrow" onclick="setTabView('tomorrow',this)">明日</button>
  <button class="tab"    id="tab-week"     onclick="setTabView('week',this)">今週</button>
  <button class="tab"    id="tab-all"      onclick="setTabView('all',this)">すべて</button>
</div>

<!-- MAIN -->
<div id="cardArea"></div>

<!-- BOTTOM NAV -->
<div class="bnav">
  <button class="nb" onclick="location.href='https://tiny-sawine-5a9d7e.netlify.app/admin.html'"><span style="font-size:20px">🏠</span>シフト</button>
  <button class="nb" style="color:var(--ink)" onclick=""><span style="font-size:20px">📅</span>CO管理</button>
  <button class="nb" onclick="location.href='https://tiny-sawine-5a9d7e.netlify.app/staff.html'"><span style="font-size:20px">👤</span>スタッフ</button>
</div>

<!-- CLEANING STATUS MODAL -->
<div class="overlay" id="modalOverlay">
  <div class="modal">
    <div class="m-handle"></div>
    <div class="m-title" id="modalPropName">物件名</div>
    <div class="m-sub" id="modalDate">日付</div>
    <div class="m-prop-info" id="modalPropInfo"></div>
    <div style="font-size:12px;font-weight:700;color:var(--sub);margin-bottom:8px">清掃ステータスを更新</div>
    <div class="m-status-row">
      <button class="m-status-btn ng" id="mBtnNg" onclick="pickStatus('ng')">❌<br>未手配</button>
      <button class="m-status-btn warn" id="mBtnWarn" onclick="pickStatus('warn')">⏳<br>手配済<br>未確認</button>
      <button class="m-status-btn ok" id="mBtnOk" onclick="pickStatus('ok')">✅<br>清掃<br>確認済</button>
    </div>
    <div style="font-size:12px;font-weight:700;color:var(--sub);margin-bottom:8px">シフト管理へ</div>
    <a href="https://tiny-sawine-5a9d7e.netlify.app/admin.html" class="shift-link-card" style="margin:0 0 14px">
      <div class="shift-link-ico">📋</div>
      <div class="shift-link-txt">
        <div class="shift-link-ttl">清掃シフト管理を開く</div>
        <div class="shift-link-sub">スタッフへの依頼・確認はこちら</div>
      </div>
      <span class="shift-link-arr">›</span>
    </a>
    <button class="m-save" onclick="saveStatus()">保存する</button>
    <button class="m-cancel" onclick="closeModal()">キャンセル</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase + Logic -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDZo0_H9EiHxNiqCusz_KbVjdCT17B33BI",
  authDomain: "shiftmanagement-b01bd.firebaseapp.com",
  projectId: "shiftmanagement-b01bd",
  storageBucket: "shiftmanagement-b01bd.firebasestorage.app",
  messagingSenderId: "405322282736",
  appId: "1:405322282736:web:a31507bfa42ad6e52cb435",
  databaseURL: "https://shiftmanagement-b01bd-default-rtdb.firebaseio.com"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ── CONSTANTS ──
const HOUSES = [
  { name:"NEO",    icon:"🏠", color:"#FF4081", area:"akasaka",    tag:"tag-akasaka",    label:"赤坂" },
  { name:"ZEN",    icon:"🍃", color:"#607D8B", area:"akasaka",    tag:"tag-akasaka",    label:"赤坂" },
  { name:"MIYABI", icon:"🌸", color:"#1A237E", area:"katsushika", tag:"tag-katsushika", label:"葛飾" },
];
const WD = ["日","月","火","水","木","金","土"];
const GUEST_EMOJIS = ["👩","👨","🧑","👩‍💼","👨‍💼","🧔","👩‍🦰","👱","🧕","👲"];
const SAMPLE_GUESTS = ["田中さん","Kenji M.","Sarah K.","鈴木さん","Lena W.","Mike T.","佐藤さん","Emma R."];

// ── STATE ──
let shifts = {}, settings = {}, checkoutStatuses = {};
let dbReady = false;
let currentTabView = "today";
let selectedDate = fmtDate(new Date());
let modalTargetId = null, modalPickedStatus = null;

// ── FIREBASE ──
onValue(ref(db,"shifts"), snap => {
  shifts = snap.val() || {};
  if (dbReady) render();
});
onValue(ref(db,"settings"), snap => {
  settings = snap.val() || {};
  if (!dbReady) { dbReady = true; initUI(); }
  else render();
});
onValue(ref(db,"checkoutStatuses"), snap => {
  checkoutStatuses = snap.val() || {};
  if (dbReady) render();
});

function setSyncStatus(ok) {
  const dot = document.getElementById("syncDot");
  const txt = document.getElementById("syncTxt");
  if (ok) { dot.classList.remove("syncing"); txt.textContent = "同期済み"; }
  else { dot.classList.add("syncing"); txt.textContent = "保存中..."; }
}

// ── UTILS ──
function fmtDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function dispDate(s) { const d = new Date(s+"T00:00:00"); return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`; }
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

// ── GENERATE CHECKOUT LIST ──
// チェックアウト = シフトのある日（fromAirbnb or 通常） + checkoutStatuses
function getCheckouts() {
  const today = new Date(); today.setHours(0,0,0,0);
  const list = [];

  // Firebaseのシフトからチェックアウト日を生成
  Object.entries(shifts).forEach(([id, s]) => {
    if (!s || !s.date) return;
    const d = new Date(s.date+"T00:00:00");
    const hi = s.hi ?? 0;
    const h = HOUSES[hi] || HOUSES[0];
    const statusKey = `${s.date}_${hi}`;
    const status = (checkoutStatuses[statusKey] || "ng");
    const gi = (d.getDate() + hi) % GUEST_EMOJIS.length;
    list.push({
      id: statusKey,
      date: s.date,
      prop: h,
      hi,
      time: s.te || "11:00",
      guest: s.guestName || SAMPLE_GUESTS[(d.getDate() + hi) % SAMPLE_GUESTS.length],
      emoji: GUEST_EMOJIS[gi],
      nights: 2 + (d.getDate() % 4),
      cleaning: status,
      fromAirbnb: s.fromAirbnb || false,
      confirmed: s.confirmed || false,
    });
  });

  // シフトがない場合はサンプルデータで補完（デモ）
  if (list.length === 0) {
    const propList = [
      { hi: 0, offset: 0 },
      { hi: 2, offset: 0 },
      { hi: 1, offset: 1 },
      { hi: 0, offset: 2 },
      { hi: 2, offset: 3 },
      { hi: 1, offset: 4 },
      { hi: 0, offset: 5 },
    ];
    const statuses = ["ng","warn","ok","ok","warn","ok","ok"];
    propList.forEach((p, i) => {
      const d = addDays(today, p.offset);
      const h = HOUSES[p.hi];
      const statusKey = `${fmtDate(d)}_${p.hi}`;
      list.push({
        id: statusKey,
        date: fmtDate(d),
        prop: h,
        hi: p.hi,
        time: "11:00",
        guest: SAMPLE_GUESTS[i % SAMPLE_GUESTS.length],
        emoji: GUEST_EMOJIS[i % GUEST_EMOJIS.length],
        nights: 2 + i % 4,
        cleaning: checkoutStatuses[statusKey] || statuses[i],
        fromAirbnb: i % 2 === 0,
        confirmed: i > 2,
      });
    });
  }

  return list.sort((a,b) => a.date.localeCompare(b.date) || a.hi - b.hi);
}

// ── INIT ──
function initUI() {
  setSyncStatus(true);
  buildWeekStrip();
  render();
}

// ── WEEK STRIP ──
function buildWeekStrip() {
  const today = new Date(); today.setHours(0,0,0,0);
  const checkouts = getCheckouts();
  const strip = document.getElementById("weekStrip");
  const months = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
  document.getElementById("monthLabel").textContent =
    `${today.getFullYear()}年 ${months[today.getMonth()]}`;

  let html = "";
  for (let i = -1; i <= 8; i++) {
    const d = addDays(today, i);
    const ds = fmtDate(d);
    const hasCO = checkouts.some(c => c.date === ds);
    const isToday = i === 0;
    const isActive = ds === selectedDate;
    const cls = `day-pill${hasCO?" has-co":""}${isActive?" active":""}${isToday&&!isActive?" is-today":""}`;
    html += `<div class="${cls}" data-date="${ds}" onclick="selectDay('${ds}')">
      <span class="day-name">${WD[d.getDay()]}</span>
      <span class="day-num">${d.getDate()}</span>
      ${hasCO ? `<span class="day-dot"></span>` : `<span class="day-spacer"></span>`}
    </div>`;
  }
  strip.innerHTML = html;
}

window.selectDay = function(ds) {
  selectedDate = ds;
  buildWeekStrip();
  // Override tab to show selected day
  renderCards(getCheckouts().filter(c => c.date === ds));
};

window.goToday = function() {
  selectedDate = fmtDate(new Date());
  buildWeekStrip();
  setTabView('today', document.getElementById('tab-today'));
};

// ── TABS ──
window.setTabView = function(view, el) {
  currentTabView = view;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  el.classList.add('on');
  selectedDate = fmtDate(new Date()); // reset to today on tab change
  buildWeekStrip();
  render();
};

// ── RENDER ──
function render() {
  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = fmtDate(today);
  const tomorrowStr = fmtDate(addDays(today, 1));
  const weekEndStr = fmtDate(addDays(today, 6));
  const all = getCheckouts();

  // Stats
  document.getElementById("statCO").textContent = all.filter(c => c.date === todayStr).length;
  document.getElementById("statTmr").textContent = all.filter(c => c.date === tomorrowStr).length;
  document.getElementById("statOk").textContent = all.filter(c => c.cleaning === "ok" && c.date >= todayStr).length;
  document.getElementById("statPend").textContent = all.filter(c => c.cleaning === "ng" && c.date >= todayStr).length;

  // Alert
  const hasNg = all.some(c => c.cleaning === "ng" && c.date >= todayStr && c.date <= weekEndStr);
  document.getElementById("alertBar").style.display = hasNg ? "flex" : "none";

  // Filter by tab
  let filtered;
  if (currentTabView === "today")    filtered = all.filter(c => c.date === todayStr);
  else if (currentTabView === "tomorrow") filtered = all.filter(c => c.date === tomorrowStr);
  else if (currentTabView === "week") filtered = all.filter(c => c.date >= todayStr && c.date <= weekEndStr);
  else filtered = all;

  renderCards(filtered);
}

function renderCards(list) {
  const el = document.getElementById("cardArea");
  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="empty-ico">✅</div><div class="empty-ttl">チェックアウトなし</div><div class="empty-sub">この期間に予定はありません</div></div>`;
    return;
  }

  // Group by date
  const groups = {};
  list.forEach(c => { if (!groups[c.date]) groups[c.date] = []; groups[c.date].push(c); });

  const today = fmtDate(new Date());
  const tomorrow = fmtDate(addDays(new Date(), 1));

  let html = "";
  Object.keys(groups).sort().forEach(date => {
    const d = new Date(date+"T00:00:00");
    const label = date === today ? `今日 ${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`
                : date === tomorrow ? `明日 ${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`
                : `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`;

    if (Object.keys(groups).length > 1) {
      html += `<div class="sec-lbl">${label}</div>`;
    }

    groups[date].forEach((c, i) => {
      const stMap = {
        ok:   { dot:"st-ok",   txt:"st-ok-txt",   label:"清掃確認済 ✅", btnLabel:"完了済み",   btnCls:"btn-done" },
        warn: { dot:"st-warn", txt:"st-warn-txt", label:"手配済・未確認 ⏳", btnLabel:"確認する",  btnCls:"btn-confirm" },
        ng:   { dot:"st-dot st-ng", txt:"st-ng-txt", label:"未手配 ❌", btnLabel:"今すぐ手配", btnCls:"btn-arrange" },
      };
      const st = stMap[c.cleaning] || stMap.ng;
      html += `
        <div class="co-card" style="animation-delay:${i*0.05}s">
          <div class="co-card-hdr">
            <span class="area-tag ${c.prop.tag}">${c.prop.label}</span>
            <span class="co-prop">${c.prop.icon} ${c.prop.name}</span>
            <span class="co-time">${c.time} CO</span>
          </div>
          <div class="co-body">
            <div class="guest-av" style="background:${c.prop.color}20;font-size:20px">${c.emoji}</div>
            <div style="flex:1">
              <div class="guest-name">${c.guest}</div>
              <div class="guest-meta">
                <span>🛏 ${c.nights}泊</span>
                <span>📅 ${c.date.slice(5).replace('-','/')}</span>
                ${c.fromAirbnb ? `<span style="color:var(--airbnb);font-weight:700">Airbnb</span>` : ""}
                ${c.confirmed ? `<span style="color:var(--go);font-weight:700">✅確定</span>` : ""}
              </div>
            </div>
          </div>
          <div class="co-footer">
            <div class="cleaning-status">
              <span class="st-dot ${st.dot}"></span>
              <span class="${st.txt}">${st.label}</span>
            </div>
            <button class="action-btn ${st.btnCls}" onclick="openModal('${c.id}','${c.prop.name}','${c.date}',${c.hi},'${c.cleaning}')">${st.btnLabel}</button>
          </div>
        </div>`;
    });
  });

  // シフト管理へのリンク
  html += `
    <div class="sec-lbl">清掃手配</div>
    <a href="https://tiny-sawine-5a9d7e.netlify.app/admin.html" class="shift-link-card">
      <div class="shift-link-ico">📋</div>
      <div class="shift-link-txt">
        <div class="shift-link-ttl">清掃シフト管理を開く</div>
        <div class="shift-link-sub">スタッフへのシフト依頼・確認はこちら</div>
      </div>
      <span class="shift-link-arr">›</span>
    </a>`;

  el.innerHTML = html;
}

// ── MODAL ──
window.openModal = function(id, propName, date, hi, currentStatus) {
  modalTargetId = id;
  modalPickedStatus = currentStatus;
  document.getElementById("modalPropName").textContent = `${HOUSES[hi].icon} ${propName}`;
  document.getElementById("modalDate").textContent = `チェックアウト日：${dispDate(date)}`;

  // 物件情報
  const propInfo = ((settings.propInfo || {})[hi]) || {};
  let infoHtml = "";
  if (propInfo.lock)    infoHtml += `<div class="m-prop-row"><span class="m-prop-lbl">🔐 スマートロック</span><span class="m-prop-val">${propInfo.lock}</span></div>`;
  if (propInfo.keybox)  infoHtml += `<div class="m-prop-row"><span class="m-prop-lbl">🗝 キーボックス</span><span class="m-prop-val">${propInfo.keybox}</span></div>`;
  if (propInfo.address) infoHtml += `<div class="m-prop-row"><span class="m-prop-lbl">📍 住所</span><span class="m-prop-val">${propInfo.address}</span></div>`;
  document.getElementById("modalPropInfo").innerHTML = infoHtml || `<div style="font-size:12px;color:var(--sub)">物件情報は設定画面から登録できます</div>`;

  updateModalBtns(currentStatus);
  document.getElementById("modalOverlay").classList.add("open");
};

function updateModalBtns(status) {
  ["ng","warn","ok"].forEach(s => {
    const btn = document.getElementById(`mBtn${s.charAt(0).toUpperCase()+s.slice(1)}`);
    btn.classList.toggle("on", s === status);
  });
}

window.pickStatus = function(status) {
  modalPickedStatus = status;
  updateModalBtns(status);
};

window.saveStatus = function() {
  if (!modalTargetId || !modalPickedStatus) { closeModal(); return; }
  setSyncStatus(false);
  set(ref(db, `checkoutStatuses/${modalTargetId}`), modalPickedStatus)
    .then(() => { setSyncStatus(true); toast("✅ ステータスを更新しました"); });
  closeModal();
};

window.closeModal = function() {
  document.getElementById("modalOverlay").classList.remove("open");
};
document.getElementById("modalOverlay").addEventListener("click", e => {
  if (e.target === document.getElementById("modalOverlay")) closeModal();
});
</script>
</body>
